server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /recommend/ {
        proxy_pass http://api:8000;
    }
    location /simulate {
        proxy_pass http://api:8000;
    }
    location /events/ {
        proxy_pass http://api:8000;
    }
    location /movies {
        proxy_pass http://api:8000;
    }
    location /genres {
        proxy_pass http://api:8000;
    }
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /stats {
        proxy_pass http://api:8000;
    }
    location /health {
        proxy_pass http://api:8000;
    }
}
