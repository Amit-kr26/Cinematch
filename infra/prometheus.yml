global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  # Kafka exposes no Prometheus endpoint natively — add a kafka-exporter sidecar
  # (e.g. danielqsj/kafka-exporter) and scrape it here for consumer-lag metrics.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
